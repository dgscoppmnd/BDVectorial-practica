[project]
name = "bdvextoriales-prueba-practica"
version = "0.1.0"
description = "Práctica de Bases de Datos Vectoriales para Aurum Market"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.4,<3",
    "pandas>=3.0,<4",
    "scikit-learn>=1.8,<1.9",
    "python-dotenv>=1.0",
    "ipykernel>=7.0,<8",
    "jupyterlab>=4.0,<5",
]

[project.optional-dependencies]
all = [
    "sentence-transformers>=2.0,<3",
    "faiss-cpu>=1.7.4,<2.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
