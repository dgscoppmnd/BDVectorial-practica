[project]
name = "bdvextoriales-prueba-practica"
version = "0.1.0"
description = "Práctica de Bases de Datos Vectoriales para Aurum Market"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.4,<3",
    "pandas>=3.0,<4",
    "scikit-learn>=1.8,<1.9",
    "python-dotenv>=1.0",
    "ipykernel>=7.0,<8",
    "jupyterlab>=4.0,<5",
    "sentence-transformers>=3.0,<6",
    "qdrant-client>=1.12,<2",
    "plotly>=5.24,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "fpdf2>=2.7,<3",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
